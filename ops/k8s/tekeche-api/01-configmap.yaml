# Non-sensitive config only. Anything with a credential/token/password goes in
# 02-secret.yaml instead (see that file's header for how it's actually populated).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tekeche-api-config
  namespace: tekeche
data:
  PORT: "5000"
  NODE_ENV: "production"
  OTP_EXPIRY_MINUTES: "5"
  DISPATCH_TIMEOUT_SECONDS: "60"
  JWT_EXPIRES_IN: "8h"
  BREVO_FROM_EMAIL: "noreply@tekeche.com"
  API_PUBLIC_URL: "https://api.tekeche.com"
  CORS_ORIGINS: "https://tekeche.com,https://www.tekeche.com,https://api.tekeche.com,https://security.tekeche.com"
  ADMIN_EMAIL: "assalehervekouame@gmail.com"
  PAYMENT_GATEWAY_ENABLED: "true"
  PAYMENT_GATEWAY_URL: "https://pay.tekeche.com"
  GATEWAY_RECONCILE_ENABLED: "true"
  GATEWAY_RECONCILE_CRON: "*/5 * * * *"
  GATEWAY_RECONCILE_MIN_AGE_MINUTES: "5"
  GATEWAY_RECONCILE_MAX_AGE_MINUTES: "1440"
  GATEWAY_RECONCILE_BATCH: "100"
  PLATFORM_COMMISSION_RATE: "0.00"
  BLOCKED_EMAILS: "crawlerrobo@gmail.com"
  MONGODB_RS_NAME: "rs0"
  # Sentinel mode re-enabled 2026-07-12: the 2026-07-11 issue was node-redis's
  # Sentinel+PubSub support (sub client, via pub.duplicate(), hit a persistent
  # 5s connect timeout). Fixed by switching handlers.js from the `redis`
  # package to `ioredis`, which has much more mature Sentinel+pubsub support.
  #
  # SENTINEL_HOSTS corrected 2026-08-02: this had drifted to a stale
  # pre-2026-07-13 list (2 of 3 entries were OKE node IPs from before that
  # day's node-pool resize, and it was missing BikoDC/BikoDC1/both Mongo
  # arbiters entirely) -- Build #45 (2026-07-31/08-01) rolled the current
  # 7-node Sentinel mesh out to on-prem .env and the OCI Vault secret, but
  # this K8s-native ConfigMap was never updated to match, since it's applied
  # directly via kubectl rather than through either of those channels. Found
  # while diagnosing repeated "All sentinels are unreachable" crash-loop
  # errors in the OKE tekeche-api pods.
  SENTINEL_HOSTS: "192.168.1.101:26379,192.168.1.102:26379,10.0.2.10:26379,10.0.2.20:26379,10.0.2.21:26379,10.0.4.249:26379,10.0.4.67:26379"
  SENTINEL_NAME: "mymaster"
